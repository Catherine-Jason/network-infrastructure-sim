<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Network Infrastructure Simulator</title>

    <!-- Main stylesheet -->
    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body>

    <header>
        <h1>Network Infrastructure Simulator</h1>
        <p class="subtitle">Design, connect, and troubleshoot interactive network topologies.</p>
    </header>

    <div id="toolbar">
        <button class="device-btn" data-type="router">
            <i class="fa-solid fa-route"></i> Router
        </button>

        <button class="device-btn" data-type="switch">
            <i class="fa-solid fa-network-wired"></i> Switch
        </button>

        <button class="device-btn" data-type="pc">
            <i class="fa-solid fa-desktop"></i> PC
        </button>

        <button id="connectModeBtn">
            <i class="fa-solid fa-plug"></i> Cable Mode
        </button>

        <button id="saveBtn">
            <i class="fa-solid fa-save"></i> Save
        </button>

        <button id="loadBtn">
            <i class="fa-solid fa-folder-open"></i> Load
        </button>

        <button id="exportBtn">
            <i class="fa-solid fa-file-export"></i> Export
        </button>

        <button id="importBtn">
            <i class="fa-solid fa-file-import"></i> Import
        </button>

        <button id="clearBtn">
            <i class="fa-solid fa-trash"></i> Clear All
        </button>
    </div>

    <div id="canvas"></div>

    <input id="fileInput" type="file" accept="application/json" style="display:none" />

    <script src="script.js"></script>
</body>
</html>
